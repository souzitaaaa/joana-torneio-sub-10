<!--
  Componente reutilizável: cartão de uma equipa na aba "Equipas".
  Ao contrário da Classificação (tabela J/V/E/D/Pts), aqui o foco é
  o plantel/equipa técnica (só nomes — sem número de camisola, não
  temos essa informação) e um par de estatísticas "extra" em formato
  de destaque (ícone + número), para não repetir o mesmo layout da
  Classificação. Plantel e Equipa Técnica ficam em separadores dentro
  do próprio cartão (só um é mostrado de cada vez).
-->
<template id="tpl-team-card">
    <div class="team-card">
        <div class="team-card-top">
            <div class="team-card-crest" data-slot="crest"></div>
            <div class="team-card-info">
                <span class="team-card-name" data-slot="nome"></span>
                <span class="grupo-chip" data-slot="grupo"></span>
            </div>
        </div>

        <div class="team-highlights">
            <div class="highlight">
                <i class="fa-solid fa-futbol"></i>
                <span class="highlight-val" data-slot="golos"></span>
                <span class="highlight-lbl">Golos</span>
            </div>
            <div class="highlight">
                <i class="fa-solid fa-stopwatch"></i>
                <span class="highlight-val" data-slot="minpg"></span>
                <span class="highlight-lbl">Min / Golo</span>
            </div>
            <div class="highlight">
                <i class="fa-solid fa-calendar-day"></i>
                <span class="highlight-val" data-slot="jogos"></span>
                <span class="highlight-lbl">Jogos</span>
            </div>
        </div>

        <div class="squad-tabs">
            <button type="button" class="squad-tab active" data-squad-tab="plantel">Plantel</button>
            <button type="button" class="squad-tab" data-squad-tab="staff">Equipa Técnica</button>
        </div>
        <div class="squad-list" data-slot="squad"></div>
        <div class="squad-list" data-slot="staff" hidden></div>
    </div>
</template>
